<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="渊默的学习小院：终日乾乾，夕惕若厉。">
<title>渊默的学习小院</title>
<style>
/* 布局：一道院墙似的窄栏，上面题名与一句话，下面两扇门 */
:root{
  --wall:#eef0ed;      /* 粉墙 */
  --ink:#22282a;       /* 黛瓦 */
  --soft:#5d6a68;      /* 淡墨 */
  --line:#c6cdc9;      /* 砖缝 */
  --bamboo:#4b6a55;    /* 竹青 */
  --door:#f7f8f6;      /* 门内 */
  --kai:"Kaiti SC","STKaiti","KaiTi","楷体",serif;
  --song:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
}
@media (prefers-color-scheme: dark){
  :root{--wall:#14181a;--ink:#dfe4e1;--soft:#93a19d;--line:#33403d;--bamboo:#8fb79b;--door:#1a2022;color-scheme:dark}
}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--wall);color:var(--ink);font-family:var(--song);font-size:16px;line-height:1.8;padding-inline:20px;padding-block:clamp(40px,9vh,96px) 48px}
main{max-width:1080px;margin-inline:auto;display:flex;flex-direction:column;gap:clamp(36px,7vh,64px)}
header{display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--kai);font-weight:400;font-size:clamp(2.3rem,7vw,3.6rem);line-height:1.15;margin:0;letter-spacing:.06em;text-wrap:balance}
.motto{margin:0;font-family:var(--kai);font-size:clamp(1.25rem,3.4vw,1.6rem);color:var(--bamboo);letter-spacing:.12em}
.from{margin:0;font-size:.82rem;color:var(--soft);letter-spacing:.08em}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
@media (max-width:640px){.doors{grid-template-columns:minmax(0,1fr)}}
.door{display:flex;flex-direction:column;background:var(--door);border:1px solid var(--line);color:inherit;text-decoration:none;transition:border-color .2s,transform .2s}
.door:hover,.door:focus-visible{border-color:var(--ink);transform:translateY(-2px)}
.door:focus-visible{outline:2px solid var(--bamboo);outline-offset:3px}
.pic{aspect-ratio:4/3;overflow:hidden;border-bottom:1px solid var(--line);background:var(--wall)}
.pic img,.pic svg{display:block;width:100%;height:100%;object-fit:cover}
.txt{padding:18px 20px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
.kind{font-size:.76rem;letter-spacing:.3em;color:var(--soft)}
.door h2{font-family:var(--kai);font-weight:400;font-size:1.6rem;line-height:1.3;margin:0}
.door p{margin:0;font-size:.92rem;color:var(--soft);line-height:1.75}
.go{margin-top:auto;padding-top:12px;font-size:.88rem;color:var(--bamboo);letter-spacing:.1em}
.door:hover .go{text-decoration:underline;text-underline-offset:4px}
.land{fill:var(--door);stroke:var(--line)}
.sea{fill:var(--wall)}
.rt{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;opacity:.7}
.dot{fill:var(--ink)}
.hot{fill:var(--bamboo)}
@media (prefers-reduced-motion:reduce){.door{transition:none}.door:hover{transform:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>渊默的学习小院</h1>
    <p class="motto">终日乾乾，夕惕若厉。</p>
    <p class="from">《周易 · 乾》九三</p>
  </header>

  <section class="doors" aria-label="院里的内容">
    <a class="door" href="morandi/">
      <div class="pic"><img src="morandi/cover.jpg" alt="莫兰迪线上展厅封面" loading="lazy"></div>
      <div class="txt">
        <span class="kind">展 厅</span>
        <h2>独白 · 莫兰迪线上展厅</h2>
        <p>乔治·莫兰迪：凝视与事物的本质。一个有限的世界，可以被无限次地重新看见。</p>
        <span class="go">进入展厅 →</span>
      </div>
    </a>

    <a class="door" href="sushi/">
      <div class="pic">
        <svg viewBox="40 150 700 525" preserveAspectRatio="xMidYMid slice" role="img" aria-label="苏轼行迹示意">
          <rect class="sea" x="0" y="0" width="800" height="960"/>
          <path class="land" d="M-40 0 H734 L713 8 L693 8 L644 44 L589 72 L578 96 L599 120 L624 130 L624 152 L644 156 L665 136 L684 127 L707 138 L745 144 L745 162 L707 172 L682 184 L669 198 L644 224 L630 250 L669 280 L689 320 L714 356 L724 372 L724 404 L700 414 L679 426 L703 430 L727 444 L724 472 L714 508 L689 524 L665 560 L644 600 L624 632 L596 660 L564 692 L544 708 L499 732 L457 746 L436 732 L423 760 L374 772 L333 792 L329 824 L315 830 L303 804 L301 780 L281 780 L253 774 L239 780 L208 804 L191 840 L163 880 L191 948 H-40 Z"/>
          <path class="rt" d="M99 438 Q250 300 462 248 Q360 240 220 259 M462 248 Q570 320 663 430 Q670 310 637 200 Q590 220 560 270 M560 270 Q510 330 480 422 Q470 570 465 716 Q360 800 297 859"/>
          <circle class="dot" cx="99" cy="438" r="7"/><circle class="dot" cx="462" cy="248" r="7"/><circle class="dot" cx="220" cy="259" r="6"/>
          <circle class="dot" cx="663" cy="430" r="7"/><circle class="dot" cx="637" cy="200" r="6"/><circle class="dot" cx="560" cy="270" r="6"/>
          <circle class="hot" cx="480" cy="422" r="10"/><circle class="dot" cx="465" cy="716" r="6"/>
        </svg>
      </div>
      <div class="txt">
        <span class="kind">地 图</span>
        <h2>苏轼行迹图</h2>
        <p>三十站，从眉山到常州。每一站的经历、大事，和在那里写下的诗、词、文。</p>
        <span class="go">展开地图 →</span>
      </div>
    </a>

    <a class="door" href="yangming/">
      <div class="pic">
        <svg viewBox="40 20 700 760" preserveAspectRatio="xMidYMid slice" role="img" aria-label="王阳明行迹示意">
          <rect class="sea" x="0" y="0" width="800" height="960"/>
          <path class="land" d="M-40 0 H734 L713 8 L693 8 L644 44 L589 72 L578 96 L599 120 L624 130 L624 152 L644 156 L665 136 L684 127 L707 138 L745 144 L745 162 L707 172 L682 184 L669 198 L644 224 L630 250 L669 280 L689 320 L714 356 L724 372 L724 404 L700 414 L679 426 L703 430 L727 444 L724 472 L714 508 L689 524 L665 560 L644 600 L624 632 L596 660 L564 692 L544 708 L499 732 L457 746 L436 732 L423 760 L374 772 L333 792 L329 824 L315 830 L303 804 L301 780 L281 780 L253 774 L239 780 L208 804 L191 840 L163 880 L191 948 H-40 Z"/>
          <path class="rt" d="M698 438 Q640 220 533 44 Q500 280 515 493 M533 44 Q420 300 194 566 Q340 590 485 556 M616 358 Q560 500 483 607 M678 440 Q470 640 255 727 Q360 700 463 624"/>
          <circle class="dot" cx="698" cy="438" r="7"/><circle class="dot" cx="533" cy="44" r="7"/><circle class="dot" cx="515" cy="493" r="6"/>
          <circle class="hot" cx="194" cy="566" r="10"/><circle class="dot" cx="485" cy="556" r="6"/><circle class="dot" cx="616" cy="358" r="6"/>
          <circle class="dot" cx="483" cy="607" r="7"/><circle class="dot" cx="255" cy="727" r="6"/>
        </svg>
      </div>
      <div class="txt">
        <span class="kind">地 图</span>
        <h2>王阳明行迹图</h2>
        <p>十八站，从余姚到南安。每一站的经历、大事，和在那里写下的诗文，《传习录》全在。</p>
        <span class="go">展开地图 →</span>
      </div>
    </a>
  </section>

</main>
</body>
</html>
